<svg xmlns="http://www.w3.org/2000/svg" viewBox="-250 -250 840 840" role="img" aria-label="Filedeck icon">
  <title>Filedeck Icon</title>
  <!-- Red — top -->
  <g transform="translate(0 -150) rotate(45 170 170)">
    <polygon points="210,160 160,160 160,270 70,270 0,0 270,70 270,160" fill="#c52d2d" stroke="#c52d2d" stroke-width="6" paint-order="stroke"/>
    <rect x="170" y="170" width="100" height="100" fill="#841719" stroke="#841719" stroke-width="6" paint-order="stroke"/>
  </g>
  <!-- Blue — bottom -->
  <g transform="translate(0 150) rotate(225 170 170)">
    <polygon points="210,160 160,160 160,270 70,270 0,0 270,70 270,160" fill="#5560aa" stroke="#5560aa" stroke-width="6" paint-order="stroke"/>
    <rect x="170" y="170" width="100" height="100" fill="#29398f" stroke="#29398f" stroke-width="6" paint-order="stroke"/>
  </g>
  <!-- Green — right -->
  <g transform="translate(150 0) rotate(135 170 170)">
    <polygon points="210,160 160,160 160,270 70,270 0,0 270,70 270,160" fill="#69a55e" stroke="#69a55e" stroke-width="6" paint-order="stroke"/>
    <rect x="170" y="170" width="100" height="100" fill="#2b7339" stroke="#2b7339" stroke-width="6" paint-order="stroke"/>
  </g>
  <!-- Yellow — left -->
  <g transform="translate(-150 0) rotate(315 170 170)">
    <polygon points="210,160 160,160 160,270 70,270 0,0 270,70 270,160" fill="#cdc241" stroke="#cdc241" stroke-width="6" paint-order="stroke"/>
    <rect x="170" y="170" width="100" height="100" fill="#958c33" stroke="#958c33" stroke-width="6" paint-order="stroke"/>
  </g>
</svg>
