{{- if .Values.hub.mcp.enabled }}
{{- /*
A NetworkPolicy that selects a pod for Ingress isolates that pod: every ingress that no policy allows is dropped, on all of its ports.
This policy exists to limit the MCP port, so it must not close the other hub ports. With `hub.networkPolicy.enabled` false (no other policy
selects the hub), the first rule allows the hub's other ports from anywhere, as before. With it true, hub-networkpolicy.yaml already
allows them (to its own peers), and a rule here would widen that, so it is left out. NetworkPolicies add up: the rules of both apply.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "filedeck.name" . }}-hub-mcp
  labels:
    {{- include "filedeck.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "filedeck.name" . }}
      app.kubernetes.io/component: hub
  policyTypes:
    - Ingress
  ingress:
    {{- if not .Values.hub.networkPolicy.enabled }}
    # The other hub ports stay open to every peer, as they are without a policy.
    - ports:
        - port: http
          protocol: TCP
        - port: metrics
          protocol: TCP
    {{- end }}
    {{- with .Values.hub.mcp.allowFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: mcp
          protocol: TCP
    {{- end }}
{{- end }}
