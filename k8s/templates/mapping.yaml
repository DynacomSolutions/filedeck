# Timeouts are load-bearing for file transfers and the SSE change feed:
# - timeout_ms: 0 disables the request timeout (no limit for long-running downloads/uploads).
# - idle_timeout_ms: 3600000 (1 hour) closes connections idle longer than an hour.
# - cluster_idle_timeout_ms: 0 disables idle timeout on the backend connection.
# - cluster_max_connection_lifetime_ms: 0 disables max lifetime on the backend connection.
# These settings prevent interruption of large file transfers and maintain active connections for SSE updates.
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: {{ .Values.mapping.name }}
  labels:
    {{- include "filedeck.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
spec:
  ambassador_id:
    - --apiVersion-v3alpha1-only--default
  hostname: {{ .Values.mapping.host | quote }}
  prefix: /
  service: {{ printf "%s.%s:%v" (include "filedeck.name" .) .Release.Namespace .Values.service.port | quote }}
  timeout_ms: 0
  idle_timeout_ms: 3600000
  cluster_idle_timeout_ms: 0
  cluster_max_connection_lifetime_ms: 0
