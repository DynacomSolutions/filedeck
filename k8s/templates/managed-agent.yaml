{{- if .Values.managedNodes.enabled }}
{{- $name := include "filedeck.name" . }}
{{- $staticKube := list }}
{{- range .Values.nodes }}{{- if and (ne (default "kubernetes" .mode) "native") .nodeName }}{{- $staticKube = append $staticKube .nodeName }}{{- end }}{{- end }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name }}-managed-agent
  labels:
    {{- include "filedeck.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "filedeck.name" . }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      dynacom.dev/filedeck-managed-agent: "true"
  template:
    metadata:
      labels:
        {{- include "filedeck.labels" . | nindent 8 }}
        app.kubernetes.io/component: agent
        dynacom.dev/filedeck-managed-agent: "true"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/os: linux
        {{ .Values.managedNodes.label }}: {{ .Values.managedNodes.value | quote }}
      {{- if $staticKube }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: {{ toJson $staticKube }}
      {{- end }}
      {{- if .Values.agent.holders.ebpf }}
      hostPID: true
      {{- end }}
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: agent
          image: {{ include "filedeck.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - {name: FILEDECK_MODE, value: agent}
            - {name: FILEDECK_ROOT, value: /host}
            - {name: FILEDECK_NODE, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: PORT, value: {{ .Values.port | quote }}}
            {{- if include "filedeck.agentTokenSecret" . }}
            - name: FILEDECK_AGENT_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "filedeck.agentTokenSecret" . }}, key: {{ .Values.agentToken.key }}}}
            {{- end }}
            {{- if .Values.auth.enabled }}
            - {name: FILEDECK_AUTH, value: "on"}
            - {name: FILEDECK_MAX_WORKERS, value: {{ .Values.auth.workers.max | quote }}}
            - {name: FILEDECK_WORKER_IDLE_SECONDS, value: {{ .Values.auth.workers.idleSeconds | quote }}}
            - {name: FILEDECK_PAM_SERVICE, value: {{ .Values.auth.pamService | quote }}}
            {{- end }}
            - {name: FILEDECK_MAX_UPLOAD, value: {{ .Values.agent.maxUpload | quote }}}
            - {name: FILEDECK_READONLY, value: {{ join "," .Values.agent.readOnlyPaths | quote }}}
            - {name: FILEDECK_INDEX_DIR, value: /var/lib/filedeck/index}
            - {name: FILEDECK_SANDBOX, value: {{ .Values.agent.sandbox | default "require" | quote }}}
            {{- if .Values.agent.fanotify.enabled }}
            - {name: FILEDECK_FANWATCH, value: /usr/local/bin/filedeck-fanwatch}
            {{- end }}
            {{- if .Values.agent.pressure.ebpf }}
            - {name: FILEDECK_IOTRACE, value: /usr/local/bin/filedeck-iotrace}
            {{- end }}
            {{- if .Values.agent.holders.ebpf }}
            - {name: FILEDECK_HOLDERS, value: /usr/local/bin/filedeck-holders}
            - {name: FILEDECK_HOLDERS_RING_MB, value: {{ .Values.agent.holders.ringMb | int64 | quote }}}
            {{- end }}
            - {name: NODE_OPTIONS, value: {{ .Values.agent.nodeOptions | quote }}}
            - {name: FILEDECK_EVENTS_JOURNAL_BYTES, value: {{ .Values.agent.events.journal.maxBytes | int64 | quote }}}
            - {name: FILEDECK_EVENTS_JOURNAL_HOURS, value: {{ .Values.agent.events.journal.maxHours | quote }}}
            {{- if .Values.agent.events.socket.enabled }}
            - {name: FILEDECK_EVENTS_SOCKET, value: /run/filedeck-events/events.sock}
            - {name: FILEDECK_EVENTS_SOCKET_GROUP, value: {{ .Values.agent.events.socket.group | quote }}}
            {{- end }}
          ports: [{name: http, containerPort: {{ .Values.port }}}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5, timeoutSeconds: 5}
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 30}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 6}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [DAC_OVERRIDE, DAC_READ_SEARCH, CHOWN, FOWNER, SETUID, SETGID{{ if .Values.agent.fanotify.enabled }}, SYS_ADMIN{{ end }}{{ if or .Values.agent.pressure.ebpf .Values.agent.holders.ebpf }}, BPF, PERFMON{{ end }}{{ if .Values.auth.enabled }}, SYS_CHROOT{{ end }}]
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - {name: host, mountPath: /host}
            - {name: tmp, mountPath: /tmp}
            - {name: index, mountPath: /var/lib/filedeck}
            {{- if .Values.agent.holders.ebpf }}
            - {name: btf, mountPath: /sys/kernel/btf, readOnly: true}
            {{- end }}
            {{- if .Values.agent.events.socket.enabled }}
            - {name: events, mountPath: /run/filedeck-events}
            {{- end }}
      volumes:
        - name: host
          hostPath: {path: /, type: Directory}
        - name: tmp
          emptyDir: {}
        - name: index
          hostPath: {path: {{ .Values.agent.indexHostPath }}, type: DirectoryOrCreate}
        {{- if .Values.agent.holders.ebpf }}
        - name: btf
          hostPath: {path: /sys/kernel/btf, type: Directory}
        {{- end }}
        {{- if .Values.agent.events.socket.enabled }}
        - name: events
          hostPath: {path: {{ .Values.agent.events.socket.hostPath }}, type: DirectoryOrCreate}
        {{- end }}
{{- end }}
