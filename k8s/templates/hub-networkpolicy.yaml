{{- if .Values.hub.networkPolicy.enabled }}
{{- $peers := .Values.hub.networkPolicy.from }}
{{- $scraper := .Values.metrics.scrapeFrom.namespaceSelector }}
# Only configured peers and the metrics scraper may reach the hub port. Use a trusted namespace for the scraper.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "filedeck.name" . }}-hub
  labels:
    {{- include "filedeck.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "filedeck.name" . }}
      app.kubernetes.io/component: hub
  policyTypes:
    - Ingress
  {{- if or $peers $scraper }}
  ingress:
    {{- with $peers }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: http
          protocol: TCP
    {{- end }}
    {{- with $scraper }}
    - from:
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
      ports:
        - port: http
          protocol: TCP
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
