{{- $withSecrets := false }}
{{- range .Values.sources }}{{ if .secretRef }}{{ $withSecrets = true }}{{ end }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "filedeck.name" . }}-hub
  labels:
    {{- include "filedeck.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "filedeck.name" . }}
      app.kubernetes.io/component: hub
  template:
    metadata:
      labels:
        {{- include "filedeck.labels" . | nindent 8 }}
        app.kubernetes.io/component: hub
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        {{- toYaml .Values.hub.nodeSelector | nindent 8 }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000 # lets the non-root hub read the mounted source Secrets (mode 0440) and write the vault volume
      containers:
        - name: hub
          image: {{ include "filedeck.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: FILEDECK_MODE
              value: hub
            - name: PORT
              value: {{ .Values.port | quote }}
            {{- with .Values.hub.nodeOptions }}
            - name: NODE_OPTIONS
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.agentToken.secretName }}
            # Shared hub-to-agent secret (Secret created out of band, never in Git).
            - name: FILEDECK_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agentToken.secretName }}
                  key: {{ .Values.agentToken.key }}
            {{- end }}
            # Saved-password vault: the AES key comes from a Secret created out of band (never in Git); the sqlite file
            # lives on its own small volume, not in user data. A missing Secret leaves the vault memory-only.
            - name: FILEDECK_VAULT_FILE
              value: /var/lib/filedeck-vault/vault.sqlite
            {{- if .Values.vault.keySecret }}
            - name: FILEDECK_VAULT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vault.keySecret }}
                  key: {{ .Values.vault.key }}
                  optional: true
            {{- end }}
            - name: FILEDECK_VAULT_TTL_SECONDS
              value: {{ .Values.vault.ttlSeconds | quote }}
            - name: FILEDECK_VAULT_MAX_HOURS
              value: {{ .Values.vault.maxHours | quote }}
            - name: NODES
              value: {{ range $i, $n := .Values.nodes }}{{ if $i }},{{ end }}{{ $n.name }}=http://{{ include "filedeck.agentName" $n }}.{{ $.Release.Namespace }}:{{ $.Values.port }}{{ end }}
            {{- if .Values.brand }}
            - name: FILEDECK_BRAND
              value: {{ .Values.brand | toJson | quote }}
            {{- end }}
            # Compare engine: per-session row spill files and the network-source index (emptyDir, never user data).
            - name: FILEDECK_DIFF_DIR
              value: /var/cache/filedeck/diff
            - name: FILEDECK_INDEX_DIR
              value: /var/cache/filedeck/index
            {{- if .Values.sources }}
            # Network sources: only non-secret fields. Credentials are read from the Secret volumes below.
            - name: FILEDECK_SOURCES
              value: {{ .Values.sources | toJson | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.hub.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: vault
              mountPath: /var/lib/filedeck-vault
            - name: cache
              mountPath: /var/cache/filedeck
            {{- if .Values.sources }}
            # smbclient (SMB sources) keeps small state files; the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
            {{- range .Values.sources }}
            {{- if .secretRef }}
            - name: src-{{ .name }}
              mountPath: /var/run/filedeck/sources/{{ .name }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- end }}
      volumes:
        - name: vault
          persistentVolumeClaim:
            claimName: {{ include "filedeck.name" . }}-vault
        # Compare rows spill here instead of the heap, so a compare of any size stays inside the memory limit.
        - name: cache
          emptyDir:
            sizeLimit: {{ .Values.hub.cacheVolume }}
        {{- if .Values.sources }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- end }}
        {{- range .Values.sources }}
        {{- if .secretRef }}
        # optional: a missing Secret leaves the source offline ("credentials are missing") instead of blocking the hub.
        - name: src-{{ .name }}
          secret:
            secretName: {{ .secretRef }}
            optional: true
            defaultMode: 0440
        {{- end }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "filedeck.name" . }}
  labels:
    {{- include "filedeck.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "filedeck.name" . }}
    app.kubernetes.io/component: hub
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
