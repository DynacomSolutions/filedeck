{{- include "filedeck.tailscaleChecks" . }}
{{- $ts := .Values.auth.tailscale }}
{{- $sc := $ts.sidecar }}
{{- $tsOn := and .Values.auth.enabled (or $sc.enabled $ts.headers $ts.socket) }}
{{- $withSecrets := false }}
{{- range .Values.sources }}{{ if .secretRef }}{{ $withSecrets = true }}{{ end }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "filedeck.name" . }}-hub
  labels:
    {{- include "filedeck.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
spec:
  replicas: 1
  strategy:
    {{- toYaml .Values.hub.strategy | nindent 4 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "filedeck.name" . }}
      app.kubernetes.io/component: hub
  template:
    metadata:
      labels:
        {{- include "filedeck.labels" . | nindent 8 }}
        app.kubernetes.io/component: hub
      {{- if or .Values.brand.cssContent (and $sc.enabled $sc.serve) }}
      annotations:
        {{- if .Values.brand.cssContent }}
        checksum/brand-css: {{ .Values.brand.cssContent | sha256sum | quote }}
        {{- end }}
        {{- if and $sc.enabled $sc.serve }}
        checksum/tailscale-serve: {{ include "filedeck.tailscaleServe" . | sha256sum | quote }}
        {{- end }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      {{- if and $sc.enabled $sc.stateSecret }}
      serviceAccountName: {{ include "filedeck.name" . }}-hub-tailscale
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.hub.nodeSelector | nindent 8 }}
      # A surging hub must run on the old hub's node: the vault is SQLite on a ReadWriteOnce volume that only one node
      # may mount, and its WAL locking only works between processes on the same host. A first pod matches itself.
      affinity:
        {{- $aff := deepCopy (.Values.hub.affinity | default dict) }}
        {{- $pa := deepCopy ($aff.podAffinity | default dict) }}
        {{- $req := $pa.requiredDuringSchedulingIgnoredDuringExecution | default list }}
        {{- $req = append $req (dict "topologyKey" "kubernetes.io/hostname" "labelSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" (include "filedeck.name" .) "app.kubernetes.io/component" "hub"))) }}
        {{- $_ := set $pa "requiredDuringSchedulingIgnoredDuringExecution" $req }}
        {{- $_ := set $aff "podAffinity" $pa }}
        {{- toYaml $aff | nindent 8 }}
      {{- with .Values.hub.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000 # lets the non-root hub read the mounted source Secrets (mode 0440) and write the vault volume
      containers:
        - name: hub
          image: {{ include "filedeck.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: FILEDECK_MODE
              value: hub
            - name: PORT
              value: {{ .Values.port | quote }}
            {{- if .Values.auth.enabled }}
            # Sign-in (see "Turning sign-in on" in docs/install.md).
            - name: FILEDECK_AUTH
              value: "on"
            {{- with .Values.auth.admins }}
            - name: FILEDECK_ADMINS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.auth.authNodes }}
            - name: FILEDECK_AUTH_NODES
              value: {{ join "," . | quote }}
            {{- end }}
            - name: FILEDECK_SESSION_IDLE_SECONDS
              value: {{ .Values.auth.session.idleSeconds | quote }}
            - name: FILEDECK_SESSION_MAX_SECONDS
              value: {{ .Values.auth.session.maxSeconds | quote }}
            {{- with .Values.auth.apiTokenAccount }}
            - name: FILEDECK_API_TOKEN_ACCOUNT
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.auth.bootstrapAdmin.secretName }}
            - name: FILEDECK_BOOTSTRAP_ADMIN_FILE
              value: /var/run/filedeck/bootstrap/{{ .Values.auth.bootstrapAdmin.key }}
            {{- end }}
            {{- end }}
            {{- if $tsOn }}
            # Sign-in with Tailscale (see "Tailscale sign-in" in docs/install.md).
            {{- if $sc.enabled }}
            - name: FILEDECK_TAILSCALE_SOCKET
              value: {{ include "filedeck.tailscaleSocketDir" . }}/tailscaled.sock
            {{- else if $ts.socket }}
            - name: FILEDECK_TAILSCALE_SOCKET
              value: {{ $ts.socket | quote }}
            {{- end }}
            {{- if $ts.headers }}
            - name: FILEDECK_TAILSCALE_HEADERS
              value: "on"
            {{- end }}
            - name: FILEDECK_TAILSCALE_PROXIES
              value: {{ include "filedeck.tailscaleProxies" . | quote }}
            {{- end }}
            {{- if .Values.hub.trustedProxies }}
            - name: FILEDECK_TRUSTED_PROXIES
              value: {{ .Values.hub.trustedProxies | quote }}
            {{- end }}
            {{- with .Values.hub.allowedHosts }}
            - name: FILEDECK_ALLOWED_HOSTS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.hub.nodeOptions }}
            - name: NODE_OPTIONS
              value: {{ . | quote }}
            {{- end }}
            {{- if include "filedeck.agentTokenSecret" . }}
            # Shared hub-to-agent secret (Secret created out of band, never in Git).
            - name: FILEDECK_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "filedeck.agentTokenSecret" . }}
                  key: {{ .Values.agentToken.key }}
            {{- end }}
            {{- if .Values.apiToken.secretName }}
            # Read-only token for the `filedeck du` CLI (Secret created out of band, never in Git).
            - name: FILEDECK_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiToken.secretName }}
                  key: {{ .Values.apiToken.key }}
            {{- end }}
            # Saved-password vault: the AES key comes from a Secret created out of band (never in Git); the sqlite file
            # lives on its own small volume, not in user data. A missing Secret leaves the vault memory-only.
            - name: FILEDECK_VAULT_FILE
              value: /var/lib/filedeck-vault/vault.sqlite
            {{- if .Values.vault.keySecret }}
            - name: FILEDECK_VAULT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vault.keySecret }}
                  key: {{ .Values.vault.key }}
                  optional: true
            {{- end }}
            - name: FILEDECK_VAULT_TTL_SECONDS
              value: {{ .Values.vault.ttlSeconds | quote }}
            - name: FILEDECK_VAULT_MAX_HOURS
              value: {{ .Values.vault.maxHours | quote }}
            - name: NODES
              value: {{ range $i, $n := .Values.nodes }}{{ if $i }},{{ end }}{{ $n.name }}=http://{{ include "filedeck.agentName" $n }}.{{ $.Release.Namespace }}:{{ $.Values.port }}{{ end }}
            {{- if .Values.brand }}
            - name: FILEDECK_BRAND
              value: {{ omit .Values.brand "cssContent" | toJson | quote }}
            {{- end }}
            # Compare engine: per-session row spill files and the network-source index (emptyDir, never user data).
            - name: FILEDECK_DIFF_DIR
              value: /var/cache/filedeck/diff
            - name: FILEDECK_INDEX_DIR
              value: /var/cache/filedeck/index
            {{- if .Values.sources }}
            # Network sources: only non-secret fields. Credentials are read from the Secret volumes below.
            - name: FILEDECK_SOURCES
              value: {{ .Values.sources | toJson | quote }}
            {{- end }}
          lifecycle:
            # Let the endpoints controller drop this pod before the process stops listening (grace period is 30s;
            # SIGTERM shutdown force-closes sockets after 5s and exits by 15s).
            preStop:
              exec: {command: ["sleep", "5"]}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.hub.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: vault
              mountPath: /var/lib/filedeck-vault
            - name: cache
              mountPath: /var/cache/filedeck
            {{- if and .Values.auth.enabled $sc.enabled }}
            - name: tailscale-socket
              mountPath: {{ include "filedeck.tailscaleSocketDir" . }}
            {{- end }}
            {{- if and .Values.auth.enabled .Values.auth.bootstrapAdmin.secretName }}
            - name: bootstrap-admin
              mountPath: /var/run/filedeck/bootstrap
              readOnly: true
            {{- end }}
            {{- if .Values.brand.cssContent }}
            - name: brand-css
              mountPath: /app/web/assets/brand/theme.css
              subPath: theme.css
              readOnly: true
            {{- end }}
            {{- if .Values.sources }}
            # smbclient (SMB sources) keeps small state files; the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
            {{- range .Values.sources }}
            {{- if .secretRef }}
            - name: src-{{ .name }}
              mountPath: /var/run/filedeck/sources/{{ .name }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- end }}
        {{- if and .Values.auth.enabled $sc.enabled }}
        - name: tailscaled
          image: {{ if $sc.image.digest }}{{ printf "%s@%s" $sc.image.repository $sc.image.digest | quote }}{{ else }}{{ printf "%s:%v" $sc.image.repository $sc.image.tag | quote }}{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # tailscaled in userspace mode: no added capability and no tun device. Its socket is in a folder the hub container shares.
          env:
            - name: TS_USERSPACE
              value: "true"
            - name: TS_SOCKET
              value: {{ include "filedeck.tailscaleSocketDir" . }}/tailscaled.sock
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: {{ $sc.authKey.secretName }}
                  key: {{ $sc.authKey.key }}
            {{- if $sc.stateSecret }}
            - name: TS_KUBE_SECRET
              value: {{ $sc.stateSecret | quote }}
            {{- else }}
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            {{- end }}
            {{- with $sc.hostname }}
            - name: TS_HOSTNAME
              value: {{ . | quote }}
            {{- end }}
            {{- if $sc.serve }}
            - name: TS_SERVE_CONFIG
              value: /etc/tailscale-serve/serve.json
            {{- end }}
            {{- with $sc.extraArgs }}
            - name: TS_EXTRA_ARGS
              value: {{ join " " . | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            {{- toYaml $sc.resources | nindent 12 }}
          volumeMounts:
            - name: tailscale-socket
              mountPath: {{ include "filedeck.tailscaleSocketDir" . }}
            {{- if not $sc.stateSecret }}
            - name: tailscale-state
              mountPath: /var/lib/tailscale
            {{- end }}
            {{- if $sc.serve }}
            - name: tailscale-serve
              mountPath: /etc/tailscale-serve
              readOnly: true
            {{- end }}
            {{- if $sc.stateSecret }}
            # the service account for the one state Secret, in this container only (the pod mounts no token)
            - name: tailscale-api
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- end }}
        {{- end }}
      volumes:
        {{- if and .Values.auth.enabled $sc.enabled }}
        - name: tailscale-socket
          emptyDir: {}
        {{- if not $sc.stateSecret }}
        - name: tailscale-state
          emptyDir: {}
        {{- end }}
        {{- if $sc.serve }}
        - name: tailscale-serve
          configMap:
            name: {{ include "filedeck.name" . }}-hub-tailscale
        {{- end }}
        {{- if $sc.stateSecret }}
        - name: tailscale-api
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
              - downwardAPI:
                  items:
                    - {path: namespace, fieldRef: {fieldPath: metadata.namespace}}
        {{- end }}
        {{- end }}
        - name: vault
          persistentVolumeClaim:
            claimName: {{ include "filedeck.name" . }}-vault
        # Compare rows spill here instead of the heap, so a compare of any size stays inside the memory limit.
        - name: cache
          emptyDir:
            sizeLimit: {{ .Values.hub.cacheVolume }}
        {{- if and .Values.auth.enabled .Values.auth.bootstrapAdmin.secretName }}
        - name: bootstrap-admin
          secret:
            secretName: {{ .Values.auth.bootstrapAdmin.secretName }}
            defaultMode: 0440
        {{- end }}
        {{- if .Values.brand.cssContent }}
        - name: brand-css
          configMap:
            name: {{ include "filedeck.name" . }}-brand-css
        {{- end }}
        {{- if .Values.sources }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- end }}
        {{- range .Values.sources }}
        {{- if .secretRef }}
        # optional: a missing Secret leaves the source offline ("credentials are missing") instead of blocking the hub.
        - name: src-{{ .name }}
          secret:
            secretName: {{ .secretRef }}
            optional: true
            defaultMode: 0440
        {{- end }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "filedeck.name" . }}
  labels:
    {{- include "filedeck.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "filedeck.name" . }}
    app.kubernetes.io/component: hub
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
