{{- if and .Values.vault.keySecret .Values.vault.keyJob.enabled }}
# Creates the vault encryption Secret on the first sync, and never again. An Argo PreSync hook (Argo renders with
# `helm template`, so randAlphaNum/lookup would regenerate the key every sync). The Job only creates the Secret when it
# does not exist: an existing key is never overwritten or rotated, since that would make the stored passwords unreadable.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "filedeck.name" . }}-vault-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "filedeck.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-3"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
---
# get is limited to the one Secret name. Kubernetes cannot restrict `create` by resourceNames (the name is not known
# at authorisation time), so create is granted separately; nothing else (no update, patch, delete, list) is allowed.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "filedeck.name" . }}-vault-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "filedeck.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-2"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.vault.keySecret | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "filedeck.name" . }}-vault-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "filedeck.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "filedeck.name" . }}-vault-key
subjects:
  - kind: ServiceAccount
    name: {{ include "filedeck.name" . }}-vault-key
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "filedeck.name" . }}-vault-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "filedeck.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        {{- include "filedeck.labels" . | nindent 8 }}
        app.kubernetes.io/component: vault-key
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "filedeck.name" . }}-vault-key
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vault-key
          image: {{ .Values.vault.keyJob.image }}
          imagePullPolicy: IfNotPresent
          env:
            - {name: HOME, value: /tmp}
            - {name: SECRET, value: {{ .Values.vault.keySecret | quote }}}
            - {name: KEY, value: {{ .Values.vault.key | quote }}}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              if kubectl get secret "$SECRET" -o name >/dev/null 2>&1; then
                echo "secret $SECRET already exists; leaving it untouched"
                exit 0
              fi
              # The value goes straight from urandom to kubectl via a file in the pod's private tmpfs; never printed.
              umask 077
              head -c 48 /dev/urandom | base64 -w0 > /tmp/key
              if kubectl create secret generic "$SECRET" --from-file="$KEY=/tmp/key" >/dev/null 2>/tmp/err; then
                echo "secret $SECRET created"
              elif kubectl get secret "$SECRET" -o name >/dev/null 2>&1; then
                echo "secret $SECRET was created concurrently; leaving it untouched"
              else
                echo "failed to create secret $SECRET" >&2; cat /tmp/err >&2; exit 1
              fi
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 8Mi}
{{- end }}
