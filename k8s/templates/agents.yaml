{{- if and .Values.auth.enabled (not (include "filedeck.agentTokenSecret" .)) }}
{{- fail "auth.enabled needs agentToken" }}
{{- end }}
{{- range $i, $n := (include "filedeck.managedNodes" . | fromYamlArray) }}
{{- with $n }}
{{- if and (ne (default "kubernetes" .mode) "native") (ne .mode (printf "%s-%s" "native" "agent")) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "filedeck.agentName" . }}
  labels:
    {{- include "filedeck.instanceLabels" (dict "root" $ "instance" (include "filedeck.agentInstance" (dict "root" $ "node" .))) | nindent 4 }}
    app.kubernetes.io/component: agent
  {{- $ann := deepCopy ($.Values.agent.annotations | default dict) }}
  {{- if $.Values.agent.stagger }}
  {{- /* One Argo CD sync wave per agent: the next agent is only touched once the previous one is Ready, so at most
         one node's agent is surging while an image change rolls out (each Deployment is a RollingUpdate with maxUnavailable 0). */}}
  {{- $_ := set $ann "argocd.argoproj.io/sync-wave" (printf "%d" (add 1 $i)) }}
  {{- end }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  strategy:
    # Old pod keeps serving until the new one is Ready. Both pods briefly share the hostPath index; it is SQLite in WAL mode with a busy timeout (a busy file is never deleted) and only a cache, so that is safe.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "filedeck.name" $ }}
      app.kubernetes.io/component: agent
      app.kubernetes.io/instance: {{ include "filedeck.agentInstance" (dict "root" $ "node" .) }}
  template:
    metadata:
      labels:
        {{- include "filedeck.instanceLabels" (dict "root" $ "instance" (include "filedeck.agentInstance" (dict "root" $ "node" .))) | nindent 8 }}
        app.kubernetes.io/component: agent
      {{- if $.Values.groups }}
      annotations:
        checksum/storage-groups: {{ $.Values.groups | toJson | sha256sum | quote }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: 30
      {{- if $.Values.agent.podStorage.enabled }}
      # The pod watch of the size gauges needs the API token (pods get/list/watch only, see agent-rbac.yaml).
      serviceAccountName: {{ include "filedeck.name" $ }}-agent
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      {{- with .nodeName }}
      nodeSelector:
        kubernetes.io/hostname: {{ . | quote }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: {{ include "filedeck.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: FILEDECK_MODE
              value: agent
            - name: FILEDECK_ROOT
              value: /host
            {{- if $.Values.groups }}
            - name: FILEDECK_GROUPS_FILE
              value: /etc/filedeck/groups/rules.json
            {{- end }}
            - name: FILEDECK_NODE
              value: {{ .name | quote }}
            - name: PORT
              value: {{ $.Values.port | quote }}
            {{- if include "filedeck.agentTokenSecret" $ }}
            # Shared hub-to-agent secret (Secret created out of band, never in Git).
            - name: FILEDECK_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "filedeck.agentTokenSecret" $ }}
                  key: {{ $.Values.agentToken.key }}
            {{- end }}
            {{- if $.Values.auth.enabled }}
            # Sign-in: every signed-in request runs in a worker process that holds the person's own user.
            - name: FILEDECK_AUTH
              value: "on"
            - name: FILEDECK_MAX_WORKERS
              value: {{ $.Values.auth.workers.max | quote }}
            - name: FILEDECK_WORKER_IDLE_SECONDS
              value: {{ $.Values.auth.workers.idleSeconds | quote }}
            - name: FILEDECK_PAM_SERVICE
              value: {{ $.Values.auth.pamService | quote }}
            {{- end }}
            - name: FILEDECK_MAX_UPLOAD
              value: {{ $.Values.agent.maxUpload | quote }}
            {{- $ro := default $.Values.agent.readOnlyPaths .readOnlyPaths }}
            {{- if $ro }}
            # Virtual paths this agent refuses to change (read-only volumes).
            - name: FILEDECK_READONLY
              value: {{ join "," $ro | quote }}
            {{- end }}
            # Thumbnail cache: a bounded emptyDir, never inside the browsed data.
            - name: FILEDECK_THUMB_DIR
              value: /var/cache/filedeck
            - name: FILEDECK_THUMB_CACHE_MAX
              value: {{ $.Values.agent.thumbCacheBytes | quote }}
            # Compare index (SQLite: listings + content hashes) on the node itself, outside any browsed data,
            # so it survives pod restarts and re-runs of a compare are served from it.
            - name: FILEDECK_INDEX_DIR
              value: /var/lib/filedeck/index
            - name: FILEDECK_INDEX_WATCHES
              value: {{ $.Values.agent.indexWatches | quote }}
            - name: FILEDECK_INDEX_REVALIDATE_MS
              value: {{ $.Values.agent.indexRevalidateMs | quote }}
            - name: FILEDECK_TRASH_MAX_AGE_DAYS
              value: {{ $.Values.agent.trash.maxAgeDays | quote }}
            - name: FILEDECK_TRASH_MAX_PERCENT
              value: {{ $.Values.agent.trash.maxPercent | quote }}
            - name: FILEDECK_TRASH_MAX_BYTES
              value: {{ $.Values.agent.trash.maxBytes | int64 | quote }}
            - name: FILEDECK_TRASH_SWEEP_MS
              value: {{ $.Values.agent.trash.sweepMs | int64 | quote }}
            - name: FILEDECK_SANDBOX
              value: {{ $.Values.agent.sandbox | default "require" | quote }}
            {{- if $.Values.agent.fanotify.enabled }}
            # Folder sizes follow kernel change notifications (needs CAP_SYS_ADMIN, see securityContext).
            - name: FILEDECK_FANWATCH
              value: /usr/local/bin/filedeck-fanwatch
            {{- end }}
            {{- if $.Values.agent.pressure.ebpf }}
            # Disk pressure attribution with eBPF (needs CAP_BPF and CAP_PERFMON, see securityContext; docs/disk-pressure.md).
            - name: FILEDECK_IOTRACE
              value: /usr/local/bin/filedeck-iotrace
            {{- end }}
            # Folder-size store writes (docs/configuration.md): one commit round per interval, and folders whose changes never reach the store.
            - name: FILEDECK_SIZE_COMMIT_MS
              value: {{ $.Values.agent.sizeStore.commitMs | int64 | quote }}
            - name: FILEDECK_SIZE_EXCLUDE
              value: {{ $.Values.agent.sizeStore.exclude | quote }}
            {{- with $.Values.agent.sizeGauges }}
            - name: FILEDECK_SIZE_GAUGES
              value: {{ join "\n" . | quote }}
            {{- end }}
            {{- if $.Values.agent.podStorage.enabled }}
            - name: FILEDECK_POD_STORAGE
              value: "on"
            - name: FILEDECK_POD_NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: FILEDECK_KUBELET_PODS_DIR
              value: {{ $.Values.agent.podStorage.kubeletPodsDir | quote }}
            - name: FILEDECK_POD_LOGS_DIR
              value: {{ $.Values.agent.podStorage.logsDir | quote }}
            {{- end }}
            # Change events (docs/change-events.md): the journal sits in the index folder above; a label template turns a path into labels.
            - name: FILEDECK_EVENTS_JOURNAL_BYTES
              value: {{ $.Values.agent.events.journal.maxBytes | int64 | quote }}
            - name: FILEDECK_EVENTS_JOURNAL_HOURS
              value: {{ $.Values.agent.events.journal.maxHours | quote }}
            {{- if $.Values.agent.events.labels }}
            - name: FILEDECK_EVENTS_LABELS
              value: {{ join "\n" $.Values.agent.events.labels | quote }}
            {{- end }}
            {{- if $.Values.agent.events.socket.enabled }}
            # The node-local Unix socket other services on this machine read events from (folder mode 0750, socket 0660).
            - name: FILEDECK_EVENTS_SOCKET
              value: /run/filedeck-events/events.sock
            {{- with $.Values.agent.events.socket.group }}
            - name: FILEDECK_EVENTS_SOCKET_GROUP
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            # Keep the V8 heap well under the container memory limit so the GC works before the cgroup would OOM-kill.
            - name: NODE_OPTIONS
              value: {{ $.Values.agent.nodeOptions | quote }}
          lifecycle:
            # Let the endpoints controller drop this pod before the process stops listening (grace period is 30s;
            # SIGTERM shutdown force-closes sockets after 5s and exits by 15s).
            preStop:
              exec: {command: ["sleep", "5"]}
          ports:
            - name: http
              containerPort: {{ $.Values.port }}
          # /healthz is answered by the same Node event loop as everything else, and the hostPath volumes sit on shared
          # hosts whose disks and CPUs spike (load averages above 100 were seen, and the agent was killed every ten minutes).
          # The 1s default timeout turned any such stall into a restart; the real fix is keeping blocking work off the
          # loop (index trim runs in a worker), these only stop a short stall from killing the pod.
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            timeoutSeconds: {{ $.Values.agent.probes.timeoutSeconds }}
          # Liveness only starts once this succeeds: opening a big store and replaying its WAL can take minutes.
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: {{ $.Values.agent.probes.timeoutSeconds }}
            failureThreshold: {{ $.Values.agent.probes.startupFailureThreshold }}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: {{ $.Values.agent.probes.timeoutSeconds }}
            failureThreshold: {{ $.Values.agent.probes.livenessFailureThreshold }}
          {{- $res := deepCopy $.Values.agent.resources }}
          {{- if $.Values.auth.enabled }}
          {{- /* Each worker is a Node process with a heap of up to 96Mi, so sign-in raises the memory limit. */}}
          {{- $lim := default dict $res.limits }}
          {{- $_ := set $lim "memory" $.Values.auth.agentMemoryLimit }}
          {{- $_ := set $res "limits" $lim }}
          {{- end }}
          resources:
            {{- toYaml $res | nindent 12 }}
          securityContext:
            # Same reasoning as the files/ dufs backends: with ALL dropped,
            # uid 0 still obeys DAC, so writing 775 dirs owned by other uids
            # needs DAC_OVERRIDE; CHOWN/FOWNER cover mkdir/chmod/rename.
            # SETUID/SETGID let the agent run ffmpeg (thumbnails) as uid/gid 65534
            # on a file descriptor it opened, so a hostile media file is parsed
            # without root or any capability. With sign-in on, the same two start
            # each person's worker as their own user, and the chroot capability
            # (added below only then) lets the host helpers run inside the
            # machine's root, with the machine's own libc, NSS and PAM. The account
            # lookup helper (filedeck-id) holds no capability once it starts; the
            # password helper (filedeck-pam) keeps DAC_READ_SEARCH only, as pam_unix
            # may need to read a mode-0000 /etc/shadow.
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["DAC_OVERRIDE", "DAC_READ_SEARCH", "CHOWN", "FOWNER", "SETUID", "SETGID"{{ if $.Values.agent.fanotify.enabled }}, "SYS_ADMIN"{{ end }}{{ if $.Values.agent.pressure.ebpf }}, "BPF", "PERFMON"{{ end }}{{ if $.Values.auth.enabled }}, "SYS_CHROOT"{{ end }}]
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            {{- if $.Values.groups }}
            - name: storage-groups
              mountPath: /etc/filedeck/groups
              readOnly: true
            {{- end }}
            - name: host
              mountPath: /host
              readOnly: false
            - name: tmp
              mountPath: /tmp
            - name: thumbs
              mountPath: /var/cache/filedeck
            - name: index
              mountPath: /var/lib/filedeck
            {{- if $.Values.agent.events.socket.enabled }}
            - name: events
              mountPath: /run/filedeck-events
            {{- end }}
      volumes:
        {{- if $.Values.groups }}
        - name: storage-groups
          configMap:
            name: {{ include "filedeck.name" $ }}-storage-groups
        {{- end }}
        - name: host
          hostPath:
            path: /
            type: Directory
        - name: tmp
          emptyDir: {}
        - name: thumbs
          emptyDir:
            sizeLimit: {{ $.Values.agent.thumbCacheVolume }}
        - name: index
          hostPath:
            path: {{ default $.Values.agent.indexHostPath .indexHostPath }}
            type: DirectoryOrCreate
        {{- if $.Values.agent.events.socket.enabled }}
        - name: events
          hostPath:
            path: {{ default $.Values.agent.events.socket.hostPath .eventsSocketHostPath }}
            type: DirectoryOrCreate
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "filedeck.agentName" . }}
  labels:
    {{- include "filedeck.instanceLabels" (dict "root" $ "instance" (include "filedeck.agentInstance" (dict "root" $ "node" .))) | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "filedeck.name" $ }}
    app.kubernetes.io/component: agent
    app.kubernetes.io/instance: {{ include "filedeck.agentInstance" (dict "root" $ "node" .) }}
  ports:
    - name: http
      port: {{ $.Values.port }}
      targetPort: http
{{- end }}
{{- end }}
{{- end }}
