{{- range .Values.nodes }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "filedeck.agentName" . }}
  labels:
    {{- include "filedeck.instanceLabels" (dict "root" $ "instance" (include "filedeck.agentInstance" (dict "root" $ "node" .))) | nindent 4 }}
    app.kubernetes.io/component: agent
  {{- with $.Values.agent.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "filedeck.name" $ }}
      app.kubernetes.io/component: agent
      app.kubernetes.io/instance: {{ include "filedeck.agentInstance" (dict "root" $ "node" .) }}
  template:
    metadata:
      labels:
        {{- include "filedeck.instanceLabels" (dict "root" $ "instance" (include "filedeck.agentInstance" (dict "root" $ "node" .))) | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      automountServiceAccountToken: false
      {{- with .nodeName }}
      nodeSelector:
        kubernetes.io/hostname: {{ . | quote }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: {{ include "filedeck.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: FILEDECK_MODE
              value: agent
            - name: FILEDECK_ROOT
              value: /host
            - name: FILEDECK_NODE
              value: {{ .name | quote }}
            - name: PORT
              value: {{ $.Values.port | quote }}
            {{- if $.Values.agentToken.secretName }}
            # Shared hub-to-agent secret (Secret created out of band, never in Git).
            - name: FILEDECK_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.agentToken.secretName }}
                  key: {{ $.Values.agentToken.key }}
            {{- end }}
            - name: FILEDECK_MAX_UPLOAD
              value: {{ $.Values.agent.maxUpload | quote }}
            {{- $ro := default $.Values.agent.readOnlyPaths .readOnlyPaths }}
            {{- if $ro }}
            # Virtual paths this agent refuses to change (read-only volumes).
            - name: FILEDECK_READONLY
              value: {{ join "," $ro | quote }}
            {{- end }}
            # Thumbnail cache: a bounded emptyDir, never inside the browsed data.
            - name: FILEDECK_THUMB_DIR
              value: /var/cache/filedeck
            - name: FILEDECK_THUMB_CACHE_MAX
              value: {{ $.Values.agent.thumbCacheBytes | quote }}
            # Compare index (SQLite: listings + content hashes) on the node itself, outside any browsed data,
            # so it survives pod restarts and re-runs of a compare are served from it.
            - name: FILEDECK_INDEX_DIR
              value: /var/lib/filedeck/index
            - name: FILEDECK_INDEX_WATCHES
              value: {{ $.Values.agent.indexWatches | quote }}
            - name: FILEDECK_INDEX_REVALIDATE_MS
              value: {{ $.Values.agent.indexRevalidateMs | quote }}
            # Keep the V8 heap well under the container memory limit so the GC works before the cgroup would OOM-kill.
            - name: NODE_OPTIONS
              value: {{ $.Values.agent.nodeOptions | quote }}
          ports:
            - name: http
              containerPort: {{ $.Values.port }}
          # /healthz is answered by the same Node event loop as everything else, and the hostPath volumes sit on shared
          # hosts whose disks and CPUs spike (load averages above 100 were seen, and the agent was killed every ten minutes).
          # The 1s default timeout turned any such stall into a restart; the real fix is keeping blocking work off the
          # loop (index trim runs in a worker), these only stop a short stall from killing the pod.
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            timeoutSeconds: {{ $.Values.agent.probes.timeoutSeconds }}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: {{ $.Values.agent.probes.timeoutSeconds }}
            failureThreshold: {{ $.Values.agent.probes.livenessFailureThreshold }}
          resources:
            {{- toYaml $.Values.agent.resources | nindent 12 }}
          securityContext:
            # Same reasoning as the files/ dufs backends: with ALL dropped,
            # uid 0 still obeys DAC, so writing 775 dirs owned by other uids
            # needs DAC_OVERRIDE; CHOWN/FOWNER cover mkdir/chmod/rename.
            # SETUID/SETGID let the agent run ffmpeg (thumbnails) as uid/gid 65534
            # on a file descriptor it opened, so a hostile media file is parsed
            # without root or any capability.
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["DAC_OVERRIDE", "DAC_READ_SEARCH", "CHOWN", "FOWNER", "SETUID", "SETGID"]
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: host
              mountPath: /host
              readOnly: false
            - name: tmp
              mountPath: /tmp
            - name: thumbs
              mountPath: /var/cache/filedeck
            - name: index
              mountPath: /var/lib/filedeck
      volumes:
        - name: host
          hostPath:
            path: /
            type: Directory
        - name: tmp
          emptyDir: {}
        - name: thumbs
          emptyDir:
            sizeLimit: {{ $.Values.agent.thumbCacheVolume }}
        - name: index
          hostPath:
            path: /var/lib/filedeck
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "filedeck.agentName" . }}
  labels:
    {{- include "filedeck.instanceLabels" (dict "root" $ "instance" (include "filedeck.agentInstance" (dict "root" $ "node" .))) | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "filedeck.name" $ }}
    app.kubernetes.io/component: agent
    app.kubernetes.io/instance: {{ include "filedeck.agentInstance" (dict "root" $ "node" .) }}
  ports:
    - name: http
      port: {{ $.Values.port }}
      targetPort: http
{{- end }}
