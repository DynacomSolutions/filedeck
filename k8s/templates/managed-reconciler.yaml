{{- if .Values.managedNodes.enabled }}
{{- $name := include "filedeck.name" . }}
{{- $staticNames := list }}
{{- range .Values.nodes }}{{- $staticNames = append $staticNames .name }}{{- end }}
{{- $staticTargets := list }}
{{- range $i, $n := .Values.nodes }}
{{- $target := "" }}
{{- if or (eq (default "kubernetes" $n.mode) "native") (eq $n.mode "native-agent") }}{{- $target = required (printf "nodes[%d].url is required for native %s" $i $n.name) $n.url }}{{- else }}{{- $target = printf "http://%s.%s:%v" (include "filedeck.agentName" $n) $.Release.Namespace (int $.Values.port) }}{{- end }}
{{- $staticTargets = append $staticTargets (printf "%s=%s" $n.name $target) }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-managed-reconciler
  labels: {{- include "filedeck.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-managed-reconciler
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-managed-reconciler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-managed-reconciler
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-managed-reconciler
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "filedeck.name" . }}-managed-reconciler
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ $name }}-managed-nodes]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [{{ $name }}-hub]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-managed-reconciler
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "filedeck.name" . }}-managed-reconciler
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-managed-reconciler
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-managed-nodes
  labels: {{- include "filedeck.labels" . | nindent 4 }}
data:
  NODES: {{ join "," $staticTargets | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-managed-reconciler
  labels: {{- include "filedeck.labels" . | nindent 4 }}
data:
  reconcile.sh: |
    #!/bin/sh
    set -eu
    namespace="$NAMESPACE"
    label="$NODE_LABEL=$NODE_VALUE"
    static_names="$STATIC_NAMES"
    app_name="$APP_NAME"
    configmap="$CONFIGMAP_NAME"
    hub="$HUB_NAME"
    release="$RELEASE_NAME"
    targets="$STATIC_TARGETS"
    owned_services=""
    # One reconcile pass: read the nodes and the agent pods, make the Services and EndpointSlices, then patch the node list and the hub when it changed.
    # A failed call ends the script (set -e); the container restarts and the first pass runs again.
    pass() {
      next="$STATIC_TARGETS"
      owned_services=""
      nodes_raw="$(kubectl get nodes -l "$label" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')"
      nodes="$(printf '%s\n' "$nodes_raw" | sort)"
      pods_raw="$(kubectl -n "$namespace" get pods -l "app.kubernetes.io/name=$app_name,app.kubernetes.io/instance=$release,dynacom.dev/filedeck-managed-agent=true" -o jsonpath='{range .items[*]}{.spec.nodeName}{"\t"}{.status.phase}{"\t"}{.status.podIP}{"\t"}{range .status.conditions[*]}{.type}{"="}{.status}{" "}{end}{"\n"}{end}')"
      for node in $nodes; do
        case ",$static_names," in *",$node,"*) continue;; esac
        node_id="$(printf '%s' "$node" | sha256sum | cut -c1-12)"
        service="${app_name}-managed-agent-$node_id"
        pod_line="$(printf '%s\n' "$pods_raw" | awk -v node="$node" '$1 == node && $2 == "Running" {for (i = 4; i <= NF; i++) if ($i == "Ready=True") {print $3; exit}}')"
        [ -n "$pod_line" ] || continue
        cat <<EOF | kubectl -n "$namespace" apply -f -
    apiVersion: v1
    kind: Service
    metadata:
      name: $service
      labels:
        app.kubernetes.io/name: {{ include "filedeck.name" . }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: agent
        dynacom.dev/filedeck-managed: "true"
    spec:
      ports:
        - name: http
          port: {{ .Values.port }}
          targetPort: http
    EOF
        cat <<EOF | kubectl -n "$namespace" apply -f -
    apiVersion: discovery.k8s.io/v1
    kind: EndpointSlice
    metadata:
      name: ${service}-ep
      labels:
        kubernetes.io/service-name: $service
        app.kubernetes.io/name: {{ include "filedeck.name" . }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        endpointslice.kubernetes.io/managed-by: filedeck-managed-reconciler
    addressType: IPv4
    ports:
      - name: http
        protocol: TCP
        port: {{ .Values.port }}
    endpoints:
      - addresses: [$pod_line]
        conditions: {ready: true}
    EOF
        owned_services="$owned_services $service"
        next="$next,$node=http://$service:$PORT"
      done
      services_raw="$(kubectl -n "$namespace" get services -l "app.kubernetes.io/name=$app_name,app.kubernetes.io/instance=$release,dynacom.dev/filedeck-managed=true" \
        -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')"
      for service in $services_raw; do
        case " $owned_services " in *" $service "*) ;; *) kubectl -n "$namespace" delete service "$service" --ignore-not-found ;; esac
      done
      slices_raw="$(kubectl -n "$namespace" get endpointslices -l "app.kubernetes.io/name=$app_name,app.kubernetes.io/instance=$release,endpointslice.kubernetes.io/managed-by=filedeck-managed-reconciler" \
        -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')"
      for slice in $slices_raw; do
        service="$(kubectl -n "$namespace" get endpointslice "$slice" -o jsonpath='{.metadata.labels.kubernetes\.io/service-name}')"
        case " $owned_services " in *" $service "*) ;; *) kubectl -n "$namespace" delete endpointslice "$slice" --ignore-not-found ;; esac
      done
      current="$(kubectl -n "$namespace" get "configmap/$configmap" -o jsonpath='{.data.NODES}')"
      hash="$(printf '%s' "$next" | sha256sum | cut -d ' ' -f 1)"
      live_hash="$(kubectl -n "$namespace" get "deployment/$hub" -o jsonpath='{.spec.template.metadata.annotations.filedeck\.dynacom\.dev/nodes-hash}')"
      if [ "$current" != "$next" ]; then
        kubectl -n "$namespace" patch configmap "$configmap" --type merge -p "{\"data\":{\"NODES\":\"$next\"}}"
      fi
      if [ "$current" != "$next" ] || [ "$live_hash" != "$hash" ]; then
        kubectl -n "$namespace" patch "deployment/$hub" --type merge -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"filedeck.dynacom.dev/nodes-hash\":\"$hash\"}}}}}"
      fi
      date +%s >"$HEARTBEAT"
    }
    # The reconciler runs no timer. It watches the Node objects that carry the label and the agent pods through the API (watch with bookmarks). Each event
    # asks for one pass; events that arrive while a pass runs share the next pass (the pending file). A watch the server ends after WATCH_SECONDS is opened
    # again, which lists the objects once and so closes the gap. Each watch writes its own heartbeat file on every line, bookmarks and keepalives included,
    # and when it opens again: the liveness probe fails when one watch is silent for longer than a watch lasts.
    dir="$(dirname "$HEARTBEAT")"
    pending="$dir/pending"
    fifo="$dir/events"
    rm -f "$pending" "$fifo"
    mkfifo "$fifo"
    exec 3<>"$fifo"
    enc() { printf '%s' "$1" | sed -e 's|/|%2F|g' -e 's|=|%3D|g' -e 's|,|%2C|g'; }
    watch_resource() {
      name="$1"
      url="$2"
      hb="$HEARTBEAT.$name"
      date +%s >"$hb"
      while :; do
        rm -f "$dir/$name.failed"
        { kubectl get --raw "$url" || : >"$dir/$name.failed"; } | while IFS= read -r line; do
          date +%s >"$hb"
          case "$line" in
            '{"type":"BOOKMARK"'*) ;;
            *) : >"$pending"; printf '%s\n' "$name" >&3 ;;
          esac
        done
        if [ -e "$dir/$name.failed" ]; then
          sleep 5
        else
          date +%s >"$hb"
        fi
      done
    }
    watch_args="watch=1&allowWatchBookmarks=true&timeoutSeconds=$WATCH_SECONDS"
    watchers=""
    trap 'kill $watchers 2>/dev/null || true' EXIT
    watch_resource nodes "/api/v1/nodes?$watch_args&labelSelector=$(enc "$label")" &
    watchers="$!"
    watch_resource pods "/api/v1/namespaces/$namespace/pods?$watch_args&labelSelector=$(enc "app.kubernetes.io/name=$app_name,app.kubernetes.io/instance=$release,dynacom.dev/filedeck-managed-agent=true")" &
    watchers="$watchers $!"
    pass
    while :; do
      read -r _ <&3
      [ -e "$pending" ] || continue
      rm -f "$pending"
      pass
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-managed-reconciler
  labels: {{- include "filedeck.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/component: managed-reconciler}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/component: managed-reconciler}
    spec:
      serviceAccountName: {{ $name }}-managed-reconciler
      automountServiceAccountToken: true
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: reconciler
          image: {{ printf "%s@%s" .Values.managedNodes.image.repository .Values.managedNodes.image.digest | quote }}
          imagePullPolicy: {{ .Values.managedNodes.image.pullPolicy }}
          command: [/bin/sh, /etc/filedeck/reconcile.sh]
          env:
            - {name: NAMESPACE, value: {{ .Release.Namespace | quote }}}
            - {name: APP_NAME, value: {{ $name | quote }}}
            - {name: RELEASE_NAME, value: {{ .Release.Name | quote }}}
            - {name: CONFIGMAP_NAME, value: {{ printf "%s-managed-nodes" $name | quote }}}
            - {name: HUB_NAME, value: {{ printf "%s-hub" $name | quote }}}
            - {name: HEARTBEAT, value: /run/filedeck/heartbeat}
            - {name: NODE_LABEL, value: {{ .Values.managedNodes.label | quote }}}
            - {name: NODE_VALUE, value: {{ .Values.managedNodes.value | quote }}}
            - {name: STATIC_NAMES, value: {{ join "," $staticNames | quote }}}
            - {name: STATIC_TARGETS, value: {{ join "," $staticTargets | quote }}}
            - {name: PORT, value: {{ .Values.port | quote }}}
            - {name: WATCH_SECONDS, value: {{ .Values.managedNodes.watchSeconds | quote }}}
          volumeMounts:
            - {name: script, mountPath: /etc/filedeck, readOnly: true}
            - {name: heartbeat, mountPath: /run/filedeck}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 100m, memory: 128Mi}}
          securityContext: {runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          # each watch writes its heartbeat on every line (events and bookmarks) and when it opens again, so it is never older than one watch lasts
          livenessProbe: {exec: {command: [/bin/sh, -c, 'now=$(date +%s); for w in nodes pods; do then=$(cat /run/filedeck/heartbeat.$w 2>/dev/null || echo 0); test $((now-then)) -lt {{ add (int .Values.managedNodes.watchSeconds) 120 }} || exit 1; done']}, periodSeconds: 30, timeoutSeconds: 5, failureThreshold: 3}
      volumes:
        - name: heartbeat
          emptyDir: {}
        - name: script
          configMap: {name: {{ $name }}-managed-reconciler, defaultMode: 365}
{{- end }}
