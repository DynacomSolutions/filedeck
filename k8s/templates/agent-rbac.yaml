{{- if .Values.agent.podStorage.enabled }}
---
# The agent token for the pod watch of the size gauges. It may only get, list and watch pods. The agent pods mounted no token before.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "filedeck.name" . }}-agent
  labels:
    {{- include "filedeck.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "filedeck.name" . }}-agent-pods
  labels:
    {{- include "filedeck.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "filedeck.name" . }}-agent-pods-{{ .Release.Namespace }}
  labels:
    {{- include "filedeck.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "filedeck.name" . }}-agent-pods
subjects:
  - kind: ServiceAccount
    name: {{ include "filedeck.name" . }}-agent
    namespace: {{ .Release.Namespace }}
{{- end }}
