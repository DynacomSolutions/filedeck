name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.detect.outputs.server }}
      web: ${{ steps.detect.outputs.web }}
      chart: ${{ steps.detect.outputs.chart }}
      image: ${{ steps.detect.outputs.image }}
      agent: ${{ steps.detect.outputs.agent }}
      contract_rust: ${{ steps.detect.outputs.contract_rust }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
        timeout-minutes: 5
      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo 'server=true' >> "$GITHUB_OUTPUT"
            echo 'web=true' >> "$GITHUB_OUTPUT"
            echo 'chart=true' >> "$GITHUB_OUTPUT"
            echo 'image=true' >> "$GITHUB_OUTPUT"
            echo 'agent=true' >> "$GITHUB_OUTPUT"
            echo 'contract_rust=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          server=false
          web=false
          chart=false
          image=false
          agent=false
          contract_rust=false
          while IFS= read -r file; do
            case "$file" in
              server/test/contract/*) server=true; image=true; contract_rust=true ;;
              server/src/group-types.ts) server=true; web=true; image=true ;;
              server/*) server=true; image=true ;;
              web/*) web=true; server=true; image=true ;;
              scripts/check-test-skips.mjs) server=true; web=true; chart=true; image=true ;;
              agent/*) agent=true; contract_rust=true ;;
              scripts/ci-image-smoke.sh) image=true ;;
              k8s/*|scripts/*) chart=true ;;
              package.json|package-lock.json|tsconfig.base.json|Dockerfile|.dockerignore|.github/workflows/*)
                server=true; web=true; chart=true; image=true; agent=true; contract_rust=true ;;
            esac
          done < <(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "chart=$chart" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "agent=$agent" >> "$GITHUB_OUTPUT"
          echo "contract_rust=$contract_rust" >> "$GITHUB_OUTPUT"

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    name: server (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [user, root]
    runs-on: ubuntu-latest
    # each leg takes about 6 minutes (p99 6.4 on 23 Nov); the rest is room for three tries of "Install test tools" on a slow Ubuntu mirror
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
        timeout-minutes: 5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
        timeout-minutes: 5
      - name: Configure apt retries
        # a stalled mirror connection times out after 30 s and apt retries it; Playwright runs apt-get itself, so flags cannot reach it
        run: |
          printf '%s\n' 'Acquire::Retries "5";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'Acquire::http::Pipeline-Depth "0";' 'DPkg::Lock::Timeout "300";' | sudo tee /etc/apt/apt.conf.d/80-ci-retries >/dev/null
        timeout-minutes: 1
      - name: Install test tools
        # the Ubuntu mirror is sometimes slow (single packages taking 20 s or more), which pushed this step past 5 minutes;
        # retries and a per-connection timeout get past a stalled download instead of waiting on it
        timeout-minutes: 10
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if timeout 3m bash -c 'sudo apt-get update && sudo apt-get install -y --no-install-recommends libarchive-tools 7zip qpdf ffmpeg git smbclient openssh-server apache2 libpam0g-dev libbpf-dev libelf-dev zlib1g-dev'; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sudo pkill -x apt-get || true
            sudo pkill -x dpkg || true
            echo "apt attempt $attempt failed, retrying"
          done
          if ! command -v 7zz >/dev/null 2>&1; then
            sudo ln -s "$(command -v 7z)" /usr/local/bin/7zz
          fi
          command -v bsdtar
          command -v 7zz
          command -v qpdf
          command -v ffmpeg
          command -v git
          command -v smbclient
          # real servers for the network source suites (server/test/sftp-openssh.test.ts, webdav-apache.test.ts); each test starts its own copy
          test -x /usr/sbin/sshd
          test -x /usr/sbin/apache2
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      # typecheck and build give the same result in both legs, so only the user leg runs them (no server test reads server/dist)
      - run: npm run typecheck -w server
        if: matrix.suite == 'user'
        timeout-minutes: 5
      - run: npm run build -w server
        if: matrix.suite == 'user'
        timeout-minutes: 5
      - name: Run server tests with the TAP skip gate
        if: matrix.suite == 'user'
        shell: bash
        run: |
          set -o pipefail
          (cd server && FILEDECK_REQUIRE_SANDBOX=1 FILEDECK_REQUIRE_SSHD=1 FILEDECK_REQUIRE_APACHE=1 node --import tsx --test --test-timeout=600000 --test-reporter=tap test/*.test.ts test/contract/*.test.ts) | node scripts/check-test-skips.mjs
        timeout-minutes: 15
      # The image build runs the whole suite as root (Dockerfile), so run it that way here too; a skip of the fanotify helper test is a failure,
      # and so is a skip of the live host helper tests (this runner has glibc; the image's Alpine build stage does not).
      # Workers run as an unprivileged account from this checkout, so that account must be able to pass through to it.
      # The runner's home folder is 0750; the image build's source folder is already open.
      - name: Let worker accounts reach the checkout
        if: matrix.suite == 'root'
        run: chmod o+x "$HOME" "$HOME/work" "$GITHUB_WORKSPACE/.."
      - name: Run the server tests as root, as the image build does
        if: matrix.suite == 'root'
        run: sudo env "PATH=$PATH" FILEDECK_REQUIRE_FANWATCH=1 FILEDECK_REQUIRE_SANDBOX=1 FILEDECK_REQUIRE_HOST_HELPERS=1 FILEDECK_REQUIRE_MOUNT=1 npm test
        working-directory: server
        timeout-minutes: 10

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
        timeout-minutes: 5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
        timeout-minutes: 5
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      - run: npm run typecheck -w web
        timeout-minutes: 5
      - run: npm test -w web
        timeout-minutes: 10
      - run: npm run build -w web
        timeout-minutes: 10

  # Drives the built app in a browser (web/test/browser): keyboard, focus, axe-core A and AA rules, layouts and a large listing.
  # One leg per browser, each running its checks in parallel processes (npm run check:parallel).
  # The hub serves the static build; the script answers /api/** itself from a deterministic fixture, so no agent is needed.
  browser:
    name: browser (${{ matrix.engine }})
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox]
    permissions:
      contents: read
    env:
      FILEDECK_URL: http://127.0.0.1:18581
      FILEDECK_EVIDENCE_DIR: ${{ github.workspace }}/web/test/browser/evidence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
        timeout-minutes: 5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/test/browser/package-lock.json
        timeout-minutes: 5
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      - run: npm ci --no-audit --no-fund
        working-directory: web/test/browser
        timeout-minutes: 5
      - run: npm run build
        timeout-minutes: 10
      # The key names the engine: each leg caches only its own browser.
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.engine }}-${{ runner.os }}-${{ hashFiles('web/test/browser/package-lock.json') }}
        timeout-minutes: 5
      - name: Configure apt retries
        # a stalled mirror connection times out after 30 s and apt retries it; Playwright runs apt-get itself, so flags cannot reach it
        run: |
          printf '%s\n' 'Acquire::Retries "5";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'Acquire::http::Pipeline-Depth "0";' 'DPkg::Lock::Timeout "300";' | sudo tee /etc/apt/apt.conf.d/80-ci-retries >/dev/null
        timeout-minutes: 1
      - name: Install ${{ matrix.engine }} for Playwright
        working-directory: web/test/browser
        run: |
          if [[ "${{ steps.playwright-cache.outputs.cache-hit }}" == true ]]; then
            install_cmd="npx playwright install-deps ${{ matrix.engine }}"
          else
            install_cmd="npx playwright install --with-deps ${{ matrix.engine }}"
          fi
          for attempt in 1 2 3; do
            if timeout 2m $install_cmd; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sudo pkill -x apt-get || true
            sudo pkill -x dpkg || true
            echo "Playwright install attempt $attempt failed, retrying"
          done
        shell: bash
        timeout-minutes: 7
      - name: Start the hub on the static build
        id: hub
        shell: bash
        run: |
          set -euo pipefail
          FILEDECK_MODE=hub FILEDECK_STATIC="$GITHUB_WORKSPACE/web/dist" PORT=18581 FILEDECK_VAULT_FILE="$RUNNER_TEMP/vault/vault.sqlite" \
            nohup node server/dist/main.js > "$RUNNER_TEMP/hub.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/hub.pid"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18581/healthz > /dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/hub.log" >&2
          exit 1
        timeout-minutes: 2
      - name: Run the browser acceptance checks in ${{ matrix.engine }}
        run: npm run check:parallel
        working-directory: web/test/browser
        env:
          BROWSER: ${{ matrix.engine }}
        timeout-minutes: 10
      - name: Stop the hub
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/hub.pid" ]]; then kill "$(cat "$RUNNER_TEMP/hub.pid")" 2>/dev/null || true; fi
          if [[ -f "$RUNNER_TEMP/hub.log" ]]; then tail -n 20 "$RUNNER_TEMP/hub.log"; fi
        timeout-minutes: 2
      - name: Upload screenshots and reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-acceptance-evidence-${{ matrix.engine }}
          path: web/test/browser/evidence
          if-no-files-found: ignore
          retention-days: 7
        timeout-minutes: 5

  chart:
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
        timeout-minutes: 5
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.3
        timeout-minutes: 5
      - run: helm lint k8s
        timeout-minutes: 5
      - run: scripts/check-chart-render.sh
        timeout-minutes: 2
      - run: npm run check:neutral
        timeout-minutes: 2

  # Builds the release image from the Dockerfile (its build stage runs the whole server suite as root) without pushing it,
  # then starts it and checks the agent, the hub, the du CLI and the shipped tools. The release workflow builds the same
  # linux/amd64 image; the layer cache (GitHub Actions cache) keeps repeat runs short.
  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
        timeout-minutes: 5
      # Docker Hub rate limits and times out on hosted runners; pull buildkit and base images via mirror.gcr.io (as the release does).
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
        timeout-minutes: 5
      - name: Build the image (no push)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: filedeck-ci:test
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
        timeout-minutes: 18
      - name: Smoke check the image
        run: scripts/ci-image-smoke.sh filedeck-ci:test
        timeout-minutes: 5

  contract:
    # the contract files (server/test/contract) against a TS agent started as a child process on loopback; docs/contract-tests.md
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
        timeout-minutes: 5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
        timeout-minutes: 5
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      - name: Run the contract files against a child-process agent
        working-directory: server
        env:
          FILEDECK_CONTRACT_MODE: spawn
        run: node --import tsx --test --test-timeout=600000 --test-concurrency=1 test/contract/*.test.ts
        timeout-minutes: 10

  contract-rust:
    # the file route contract files (server/test/contract/fs-*.test.ts) against the Rust agent (agent/, filedeckd) started as a
    # child process on loopback; docs/contract-tests.md. GitHub-hosted runners only: the repository is public.
    name: contract-rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.contract_rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
        timeout-minutes: 5
      - name: Install the pinned toolchain
        working-directory: agent
        run: rustup toolchain install
        timeout-minutes: 10
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: agent
        timeout-minutes: 5
      - name: Build filedeckd
        working-directory: agent
        run: cargo build --locked -p filedeckd
        timeout-minutes: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
        timeout-minutes: 5
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      - name: Run the file route contract files against filedeckd
        working-directory: server
        env:
          FILEDECK_CONTRACT_MODE: spawn
          FILEDECK_CONTRACT_SPAWN: ${{ github.workspace }}/agent/target/debug/filedeckd
        run: node --import tsx --test --test-timeout=600000 --test-concurrency=1 test/contract/fs-*.test.ts
        timeout-minutes: 12

  # The Rust agent (agent/). GitHub-hosted runners only: the repository is public.
  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
        timeout-minutes: 5
      - name: Install the pinned toolchain
        # rust-toolchain.toml names the version and the components; rustup is on both runner images
        run: rustup toolchain install
        timeout-minutes: 10
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: agent
        timeout-minutes: 5
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-deny
        timeout-minutes: 5
      - run: cargo fmt --check
        timeout-minutes: 2
      - run: cargo clippy --locked --all-targets -- -D warnings
        timeout-minutes: 10
      - run: cargo test --locked
        timeout-minutes: 10
      - run: cargo deny --locked check
        timeout-minutes: 5

  aggregate:
    if: always()
    needs: [changes, server, contract, contract-rust, web, browser, chart, image, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report required checks
        shell: bash
        run: |
          set -euo pipefail
          echo "changes=${{ needs.changes.result }}"
          echo "server=${{ needs.server.result }}"
          echo "contract=${{ needs.contract.result }}"
          echo "web=${{ needs.web.result }}"
          echo "browser=${{ needs.browser.result }}"
          echo "chart=${{ needs.chart.result }}"
          echo "image=${{ needs.image.result }}"
          echo "contract-rust=${{ needs.contract-rust.result }}"
          echo "rust=${{ needs.rust.result }}"
          for result in "${{ needs.changes.result }}" "${{ needs.server.result }}" "${{ needs.contract.result }}" "${{ needs.contract-rust.result }}" "${{ needs.web.result }}" "${{ needs.browser.result }}" "${{ needs.chart.result }}" "${{ needs.image.result }}" "${{ needs.rust.result }}"; do
            if [[ "$result" == failure || "$result" == cancelled ]]; then
              exit 1
            fi
          done
          exit 0
