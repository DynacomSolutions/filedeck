name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.detect.outputs.server }}
      web: ${{ steps.detect.outputs.web }}
      chart: ${{ steps.detect.outputs.chart }}
      image: ${{ steps.detect.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
        timeout-minutes: 5
      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo 'server=true' >> "$GITHUB_OUTPUT"
            echo 'web=true' >> "$GITHUB_OUTPUT"
            echo 'chart=true' >> "$GITHUB_OUTPUT"
            echo 'image=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          server=false
          web=false
          chart=false
          image=false
          while IFS= read -r file; do
            case "$file" in
              server/*) server=true; image=true ;;
              web/*) web=true; server=true; image=true ;;
              scripts/check-test-skips.mjs) server=true; web=true; chart=true; image=true ;;
              scripts/ci-image-smoke.sh) image=true ;;
              k8s/*|scripts/*) chart=true ;;
              package.json|package-lock.json|tsconfig.base.json|Dockerfile|.dockerignore|.github/workflows/*)
                server=true; web=true; chart=true; image=true ;;
            esac
          done < <(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "chart=$chart" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
        timeout-minutes: 5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
        timeout-minutes: 5
      - name: Install test tools
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools 7zip qpdf ffmpeg git smbclient
          if ! command -v 7zz >/dev/null 2>&1; then
            sudo ln -s "$(command -v 7z)" /usr/local/bin/7zz
          fi
          command -v bsdtar
          command -v 7zz
          command -v qpdf
          command -v ffmpeg
          command -v git
          command -v smbclient
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      - run: npm run typecheck -w server
        timeout-minutes: 5
      - run: npm run build -w server
        timeout-minutes: 5
      - name: Run server tests with the TAP skip gate
        shell: bash
        run: |
          set -o pipefail
          (cd server && FILEDECK_REQUIRE_SANDBOX=1 node --import tsx --test --test-timeout=600000 --test-reporter=tap test/*.test.ts) | node scripts/check-test-skips.mjs
        timeout-minutes: 15
      # The image build runs the whole suite as root (Dockerfile), so run it that way here too; a skip of the fanotify helper test is a failure.
      - name: Run the server tests as root, as the image build does
        run: sudo env "PATH=$PATH" FILEDECK_REQUIRE_FANWATCH=1 FILEDECK_REQUIRE_SANDBOX=1 npm test
        working-directory: server
        timeout-minutes: 10

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
        timeout-minutes: 5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
        timeout-minutes: 5
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      - run: npm run typecheck -w web
        timeout-minutes: 5
      - run: npm test -w web
        timeout-minutes: 10
      - run: npm run build -w web
        timeout-minutes: 10

  # Drives the built app in Chromium (web/test/browser): keyboard, focus, axe-core A and AA rules, layouts and a large listing.
  # The hub serves the static build; the script answers /api/** itself from a deterministic fixture, so no agent is needed.
  browser:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      FILEDECK_URL: http://127.0.0.1:18581
      FILEDECK_EVIDENCE_DIR: ${{ github.workspace }}/web/test/browser/evidence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
        timeout-minutes: 5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/test/browser/package-lock.json
        timeout-minutes: 5
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      - run: npm ci --no-audit --no-fund
        working-directory: web/test/browser
        timeout-minutes: 5
      - run: npm run build
        timeout-minutes: 10
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/test/browser/package-lock.json') }}
        timeout-minutes: 5
      - name: Install Chromium for Playwright
        working-directory: web/test/browser
        run: |
          if [[ "${{ steps.playwright-cache.outputs.cache-hit }}" == true ]]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
        shell: bash
        timeout-minutes: 5
      - name: Start the hub on the static build
        shell: bash
        run: |
          set -euo pipefail
          FILEDECK_MODE=hub FILEDECK_STATIC="$GITHUB_WORKSPACE/web/dist" PORT=18581 FILEDECK_VAULT_FILE="$RUNNER_TEMP/vault/vault.sqlite" \
            nohup node server/dist/main.js > "$RUNNER_TEMP/hub.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/hub.pid"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18581/healthz > /dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/hub.log" >&2
          exit 1
        timeout-minutes: 2
      - name: Run the browser acceptance checks
        run: npm run check
        working-directory: web/test/browser
        timeout-minutes: 10
      - name: Stop the hub
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/hub.pid" ]]; then kill "$(cat "$RUNNER_TEMP/hub.pid")" 2>/dev/null || true; fi
          if [[ -f "$RUNNER_TEMP/hub.log" ]]; then tail -n 20 "$RUNNER_TEMP/hub.log"; fi
        timeout-minutes: 2
      - name: Upload screenshots and reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-acceptance-evidence
          path: web/test/browser/evidence
          if-no-files-found: ignore
          retention-days: 7
        timeout-minutes: 5

  chart:
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
        timeout-minutes: 5
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.3
        timeout-minutes: 5
      - run: helm lint k8s
        timeout-minutes: 5
      - run: npm run check:neutral
        timeout-minutes: 2

  # Builds the release image from the Dockerfile (its build stage runs the whole server suite as root) without pushing it,
  # then starts it and checks the agent, the hub, the du CLI and the shipped tools. The release workflow builds the same
  # linux/amd64 image; the layer cache (GitHub Actions cache) keeps repeat runs short.
  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
        timeout-minutes: 5
      # Docker Hub rate limits and times out on hosted runners; pull buildkit and base images via mirror.gcr.io (as the release does).
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
        timeout-minutes: 5
      - name: Build the image (no push)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: filedeck-ci:test
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
        timeout-minutes: 30
      - name: Smoke check the image
        run: scripts/ci-image-smoke.sh filedeck-ci:test
        timeout-minutes: 5

  aggregate:
    if: always()
    needs: [changes, server, web, browser, chart, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report required checks
        shell: bash
        run: |
          set -euo pipefail
          echo "changes=${{ needs.changes.result }}"
          echo "server=${{ needs.server.result }}"
          echo "web=${{ needs.web.result }}"
          echo "browser=${{ needs.browser.result }}"
          echo "chart=${{ needs.chart.result }}"
          echo "image=${{ needs.image.result }}"
          for result in "${{ needs.changes.result }}" "${{ needs.server.result }}" "${{ needs.web.result }}" "${{ needs.browser.result }}" "${{ needs.chart.result }}" "${{ needs.image.result }}"; do
            if [[ "$result" == failure || "$result" == cancelled ]]; then
              exit 1
            fi
          done
          exit 0
