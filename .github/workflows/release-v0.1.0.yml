name: Release v0.1.0

on:
  push:
    tags: ['v0.1.0']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libarchive-tools 7zip qpdf ffmpeg git smbclient
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      - name: Verify the tagged release
        run: npm run typecheck && npm run build && npm test && npm run check:neutral
        timeout-minutes: 20

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Package chart
        run: |
          mkdir -p dist
          helm package k8s --destination dist
          test -f dist/filedeck-0.1.0.tgz
        timeout-minutes: 5

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/dynacomsolutions/filedeck:0.1.0
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=0.1.0
            org.opencontainers.image.title=Filedeck
            org.opencontainers.image.description=Web file manager with per-node agents and a hub
      - name: Create GitHub release and upload chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create v0.1.0 dist/filedeck-0.1.0.tgz --repo "$GITHUB_REPOSITORY" --title 'Filedeck v0.1.0' --generate-notes
