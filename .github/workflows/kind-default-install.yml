name: Kind default install

on:
  workflow_dispatch:
    inputs:
      version:
        description: Released chart version to install, without the v prefix
        required: false
        default: "0.3.36"
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.3
      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: filedeck-smoke
          wait: 60s

      - name: Download the released chart archive
        env:
          FILEDECK_VERSION: ${{ inputs.version || '0.3.36' }}
        run: |
          set -euo pipefail
          if [[ ! "$FILEDECK_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Chart version must be a stable semver MAJOR.MINOR.PATCH: $FILEDECK_VERSION" >&2
            exit 1
          fi
          archive="filedeck-${FILEDECK_VERSION}.tgz"
          curl --fail --location --retry 3 --output "$archive" "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${FILEDECK_VERSION}/${archive}"
        timeout-minutes: 5
      - name: Install the chart with its defaults
        env:
          FILEDECK_VERSION: ${{ inputs.version || '0.3.36' }}
        run: helm install filedeck "./filedeck-${FILEDECK_VERSION}.tgz" --namespace filedeck --create-namespace --wait --timeout 5m
        timeout-minutes: 7
      - name: Wait for hub, agent and vault key Job
        run: |
          kubectl --namespace filedeck wait --for=condition=available deployment/filedeck-hub --timeout=180s
          kubectl --namespace filedeck wait --for=condition=available deployment/filedeck-agent-local --timeout=180s
          kubectl --namespace filedeck wait --for=condition=complete job/filedeck-vault-key --timeout=180s
          kubectl --namespace filedeck logs job/filedeck-vault-key
        timeout-minutes: 7
      - name: Check health, node visibility and persistent vault readiness
        shell: bash
        run: |
          set -euo pipefail
          kubectl get nodes
          kubectl --namespace filedeck port-forward service/filedeck 18080:80 >/tmp/filedeck-port-forward.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
          health_ready=false
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18080/healthz; then
              health_ready=true
              break
            fi
            sleep 2
          done
          if [[ "$health_ready" != true ]]; then
            echo "Health check did not succeed after 60 attempts." >&2
            exit 1
          fi
          test "$(curl --fail --silent http://127.0.0.1:18080/healthz)" = ok
          nodes=$(curl --fail --silent http://127.0.0.1:18080/api/nodes)
          echo "$nodes"
          test "$(echo "$nodes" | jq -r '.nodes[0].name')" = local
          test "$(echo "$nodes" | jq -r '.nodes[0].online')" = true
          vault=$(curl --fail --silent http://127.0.0.1:18080/api/vault)
          echo "$vault"
          test "$(echo "$vault" | jq -r '.persistent')" = true
        timeout-minutes: 5
