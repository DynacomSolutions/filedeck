[workspace]
members = ["crates/fd-core", "crates/fd-fs", "crates/fd-http", "crates/filedeckd"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
http-body-util = "0.1"
rustix = { version = "1", default-features = false, features = ["fs", "process", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }

fd-core = { path = "crates/fd-core" }
fd-fs = { path = "crates/fd-fs" }
fd-http = { path = "crates/fd-http" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
